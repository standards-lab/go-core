# See architecture/standards/go-elemental/principles/release-and-ci.md
[settings]
task.run_auto_install = false

[tools]
"github:standards-lab/claude-plugins" = { version = "0.24.1", version_prefix = "marathon/v" }
go = "1.27.4"
golangci-lint = "2.15.0"
jq = "1.8.2"

[env]
GO_MODULES = "."

[tasks.check]
description = "Build, vet, format, fix, tidy, test, and lint every module, then run lint-context and lint-references; writes nothing"
run = '''
set -eu
export GOWORK=off
for mod in $GO_MODULES; do
  echo "check: $mod"
  cd "$MISE_PROJECT_ROOT/$mod"
  go build ./...
  go vet ./...
  unformatted=$(gofmt -l .)
  if [ -n "$unformatted" ]; then echo "gofmt: unformatted files:"; echo "$unformatted"; exit 1; fi
  go fix -diff ./...
  go mod tidy -diff
  go test -race ./...
  golangci-lint run ./...
done
cd "$MISE_PROJECT_ROOT"
fail=0
for lint in lint-context lint-references; do
  if ! command -v "$lint" >/dev/null; then
    echo "FAIL: $lint is not on PATH; run mise install" >&2
    fail=1
  elif ! "$lint"; then
    fail=1
  fi
done
exit "$fail"
'''

[tasks.currency]
description = "Report every requirement, Go version, tool, and action pin behind its latest; writes nothing"
run = "scripts/currency.sh"

[tasks.upgrade]
description = "Upgrade every module's go directive (to the current Go minor, with no toolchain line) and direct requirements and the local mise tools to their latest, rewriting go.mod and mise.toml"
run = '''
set -eu
export GOWORK=off
go_minor=$(mise latest go | cut -d. -f1,2)
for mod in $GO_MODULES; do
  cd "$MISE_PROJECT_ROOT/$mod"
  go mod edit -go="$go_minor" -toolchain=none
  direct=$(go mod edit -json | jq -r '.Require[]? | select(.Indirect | not) | .Path')
  [ -z "$direct" ] || go get $(printf '%s@latest ' $direct)
  go mod tidy
done
cd "$MISE_PROJECT_ROOT"
mise upgrade --bump --local
'''

[tasks.build]
description = "Build the module"
run = "go build ./..."

[tasks.test]
description = "Run tests"
run = "go test -race ./..."

[tasks.vet]
description = "Run go vet"
run = "go vet ./..."

[tasks.fmt]
description = "Format all Go source"
run = "gofmt -w ."

[tasks.tidy]
description = "Run go mod tidy"
run = "go mod tidy"

[tasks.lint]
description = "Run golangci-lint"
run = "golangci-lint run ./..."
